name: Gateway

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'go.work'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/gateway.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - 'go.work'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/gateway.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run -buildvcs=false . -config examples/config.json -test-policies policy-tests.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sekisho:ci
      - name: Run policy fixtures in the image
        run: docker run --rm -e OTEL_SDK_DISABLED=true sekisho:ci -config config.json -test-policies policy-tests.json

  changeset:
    # Every gateway change needs a changeset; use `pnpm changeset --empty` for
    # changes that should not be released. The Release pull request is exempt.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
