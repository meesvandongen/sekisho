name: Gateway

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'go.work'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/gateway.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - 'go.work'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/gateway.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run -buildvcs=false . -config examples/config.json -test-policies policy-tests.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sekisho:ci
      - name: Run policy fixtures in the image
        run: docker run --rm -e OTEL_SDK_DISABLED=true sekisho:ci -config config.json -test-policies policy-tests.json
