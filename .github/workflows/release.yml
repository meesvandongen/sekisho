name: Release

# Changesets owns the version. On every push to main this either opens or
# updates the "Release" pull request (while changesets are pending), or, once
# that pull request is merged, tags v<version> and publishes the release.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          title: Release
          commit: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: tag
        name: Tag the release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          tag="v$(node -p "require('./gateway/package.json').version")"
          if [ "$tag" = v0.0.0 ] || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Nothing to release ($tag)."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go test ./...
      - run: go run -buildvcs=false . -config examples/config.json -test-policies policy-tests.json
      - name: Build release archives
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          # Build otelc for the runner once; `go tool otelc` would build it for GOOS/GOARCH.
          otelc="$RUNNER_TEMP/otelc"
          go build -o "$otelc" go.opentelemetry.io/otelc/tool/cmd/otelc
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="sekisho_${os}_${arch}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            stage="$RUNNER_TEMP/$name"
            mkdir -p "$stage"
            echo "::group::$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              "$otelc" go build -buildvcs=false -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" \
                -o "$stage/sekisho$ext" .
            cp -R examples "$stage/examples"
            if [ "$os" = windows ]; then
              (cd "$RUNNER_TEMP" && zip -qr "$dist/$name.zip" "$name")
            else
              tar -C "$RUNNER_TEMP" -czf "$dist/$name.tar.gz" "$name"
            fi
            echo "::endgroup::"
          done
          (cd "$dist" && sha256sum * > checksums.txt)
      - name: Smoke-test the Linux binary
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf ../dist/sekisho_linux_amd64.tar.gz -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke/sekisho_linux_amd64"
          ./sekisho -version
          ./sekisho -config examples/config.json -test-policies policy-tests.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Release notes are this version's section of the Changesets changelog.
          awk -v heading="## ${TAG#v}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" ../dist/* --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $prerelease

  image:
    name: Container image
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }},enable=${{ !startsWith(needs.version.outputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.tag, '-') }}
          labels: |
            org.opencontainers.image.title=Sekisho
            org.opencontainers.image.description=OIDC policy gateway
            org.opencontainers.image.url=https://sekisho.mvd.im
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.tag }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
